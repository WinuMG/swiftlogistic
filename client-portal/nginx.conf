# Nginx config for React app with API proxy
server {
    listen 80;
    server_name _;

    # Serve static files from /usr/share/nginx/html
    root /usr/share/nginx/html;
    index index.html;

    # Use Docker's internal DNS so api-gateway hostname resolves dynamically
    # (avoids 502 after container restarts/rebuilds change the gateway IP)
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $upstream http://api-gateway:3000;

    # Proxy API requests to the API gateway
    location /api/ {
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # WebSocket proxy for Socket.io real-time events
    location /socket.io/ {
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
    }

    # React router fallback: serve index.html for all other requests
    location / {
        try_files $uri /index.html;
    }
}

version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: swiftlogistics-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: swiftlogistics123
      MONGO_INITDB_DATABASE: swiftlogistics
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./scripts/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - swiftlogistics-network

  # Redis Cache
  redis:
    image: redis:7.2-alpine
    container_name: swiftlogistics-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - swiftlogistics-network

  # RabbitMQ Message Broker
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: swiftlogistics-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: swiftlogistics123
      RABBITMQ_DEFAULT_VHOST: /
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - swiftlogistics-network

  # API Gateway
  api-gateway:
    build:
      context: .
      dockerfile: ./services/api-gateway/Dockerfile
    container_name: swiftlogistics-api-gateway
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGODB_URI: mongodb://admin:swiftlogistics123@mongodb:27017/swiftlogistics?authSource=admin
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://admin:swiftlogistics123@rabbitmq:5672
      JWT_SECRET: swiftlogistics-super-secret-jwt-key-2025
      CLIENT_URL: http://localhost:8081
      SERVICE_REGISTRY_URL: http://service-registry:3009
      REGISTRY_URL: http://service-registry:3009
      SERVICE_HOST: api-gateway
    depends_on:
      - mongodb
      - redis
      - rabbitmq
      - service-registry
    networks:
      - swiftlogistics-network

  # Client Management Service
  client-service:
    build:
      context: .
      dockerfile: ./services/client-service/Dockerfile
    container_name: swiftlogistics-client-service
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      MONGODB_URI: mongodb://admin:swiftlogistics123@mongodb:27017/swiftlogistics?authSource=admin
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://admin:swiftlogistics123@rabbitmq:5672
      JWT_SECRET: swiftlogistics-super-secret-jwt-key-2025
      CLIENT_URL: http://localhost:8081
      SERVICE_REGISTRY_URL: http://service-registry:3009
      REGISTRY_URL: http://service-registry:3009
      SERVICE_HOST: client-service
    depends_on:
      - mongodb
      - redis
      - rabbitmq
      - service-registry
    networks:
      - swiftlogistics-network

  # Order Management Service
  order-service:
    build:
      context: .
      dockerfile: ./services/order-service/Dockerfile
    container_name: swiftlogistics-order-service
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      NODE_ENV: production
      PORT: 3002
      MONGODB_URI: mongodb://admin:swiftlogistics123@mongodb:27017/swiftlogistics?authSource=admin
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://admin:swiftlogistics123@rabbitmq:5672
      JWT_SECRET: swiftlogistics-super-secret-jwt-key-2025
      CLIENT_URL: http://localhost:8081
      SERVICE_REGISTRY_URL: http://service-registry:3009
      REGISTRY_URL: http://service-registry:3009
      SERVICE_HOST: order-service
    depends_on:
      - mongodb
      - redis
      - rabbitmq
      - service-registry
    networks:
      - swiftlogistics-network

  # Route Optimization Service
  route-service:
    build:
      context: .
      dockerfile: ./services/route-service/Dockerfile
    container_name: swiftlogistics-route-service
    restart: unless-stopped
    ports:
      - "3003:3003"
    environment:
      NODE_ENV: production
      PORT: 3003
      MONGODB_URI: mongodb://admin:swiftlogistics123@mongodb:27017/swiftlogistics?authSource=admin
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://admin:swiftlogistics123@rabbitmq:5672
      JWT_SECRET: swiftlogistics-super-secret-jwt-key-2025
      CLIENT_URL: http://localhost:8081
      SERVICE_REGISTRY_URL: http://service-registry:3009
      REGISTRY_URL: http://service-registry:3009
      SERVICE_HOST: route-service
    depends_on:
      - mongodb
      - redis
      - rabbitmq
      - service-registry
    networks:
      - swiftlogistics-network

  # Warehouse Management Service
  warehouse-service:
    build:
      context: .
      dockerfile: ./services/warehouse-service/Dockerfile
    container_name: swiftlogistics-warehouse-service
    restart: unless-stopped
    ports:
      - "3004:3004"
    environment:
      NODE_ENV: production
      PORT: 3004
      MONGODB_URI: mongodb://admin:swiftlogistics123@mongodb:27017/swiftlogistics?authSource=admin
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://admin:swiftlogistics123@rabbitmq:5672
      JWT_SECRET: swiftlogistics-super-secret-jwt-key-2025
      CLIENT_URL: http://localhost:8081
      SERVICE_REGISTRY_URL: http://service-registry:3009
      REGISTRY_URL: http://service-registry:3009
      SERVICE_HOST: warehouse-service
    depends_on:
      - mongodb
      - redis
      - rabbitmq
      - service-registry
    networks:
      - swiftlogistics-network

  # Notification Service
  notification-service:
    build:
      context: .
      dockerfile: ./services/notification-service/Dockerfile
    container_name: swiftlogistics-notification-service
    restart: unless-stopped
    ports:
      - "3005:3005"
    environment:
      NODE_ENV: production
      PORT: 3005
      MONGODB_URI: mongodb://admin:swiftlogistics123@mongodb:27017/swiftlogistics?authSource=admin
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://admin:swiftlogistics123@rabbitmq:5672
      JWT_SECRET: swiftlogistics-super-secret-jwt-key-2025
      CLIENT_URL: http://localhost:8081
      SERVICE_REGISTRY_URL: http://service-registry:3009
      REGISTRY_URL: http://service-registry:3009
      SERVICE_HOST: notification-service
    depends_on:
      - mongodb
      - redis
      - rabbitmq
      - service-registry
    networks:
      - swiftlogistics-network

  # CMS Service (SOAP/XML Mock)
  cms-service:
    build:
      context: .
      dockerfile: ./services/cms-service/Dockerfile
    container_name: swiftlogistics-cms-service
    restart: unless-stopped
    ports:
      - "3007:3007"
    environment:
      NODE_ENV: production
      PORT: 3007
      MONGODB_URI: mongodb://admin:swiftlogistics123@mongodb:27017/swiftlogistics?authSource=admin
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://admin:swiftlogistics123@rabbitmq:5672
      JWT_SECRET: swiftlogistics-super-secret-jwt-key-2025
      CLIENT_URL: http://localhost:8081
      SERVICE_REGISTRY_URL: http://service-registry:3009
      REGISTRY_URL: http://service-registry:3009
      SERVICE_HOST: cms-service
    depends_on:
      - mongodb
      - redis
      - rabbitmq
      - service-registry
    networks:
      - swiftlogistics-network

  # Integration / ESB Service (SAGA Orchestrator)
  integration-service:
    build:
      context: .
      dockerfile: ./services/integration-service/Dockerfile
    container_name: swiftlogistics-integration-service
    restart: unless-stopped
    ports:
      - "3008:3008"
    environment:
      NODE_ENV: production
      PORT: 3008
      MONGODB_URI: mongodb://admin:swiftlogistics123@mongodb:27017/swiftlogistics?authSource=admin
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://admin:swiftlogistics123@rabbitmq:5672
      JWT_SECRET: swiftlogistics-super-secret-jwt-key-2025
      CLIENT_URL: http://localhost:8081
      SERVICE_REGISTRY_URL: http://service-registry:3009
      CMS_SERVICE_URL: http://cms-service:3007
      WMS_SERVICE_URL: http://wms-service:4001
      WMS_TCP_HOST: wms-service
      WMS_TCP_PORT: 4000
      ROUTE_SERVICE_URL: http://route-service:3003
      SERVICE_HOST: integration-service
    depends_on:
      - mongodb
      - redis
      - rabbitmq
      - cms-service
      - wms-service
      - route-service
    networks:
      - swiftlogistics-network

  # Service Registry
  service-registry:
    build:
      context: .
      dockerfile: ./services/service-registry/Dockerfile
    container_name: swiftlogistics-service-registry
    restart: unless-stopped
    ports:
      - "3009:3009"
    environment:
      NODE_ENV: production
      PORT: 3009
      MONGODB_URI: mongodb://admin:swiftlogistics123@mongodb:27017/swiftlogistics?authSource=admin
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://admin:swiftlogistics123@rabbitmq:5672
      JWT_SECRET: swiftlogistics-super-secret-jwt-key-2025
      CLIENT_URL: http://localhost:8081
      SERVICE_HOST: service-registry
    depends_on:
      - mongodb
      - redis
      - rabbitmq
    networks:
      - swiftlogistics-network

  # WMS Service (TCP/IP Mock)
  wms-service:
    build:
      context: .
      dockerfile: ./services/wms-service/Dockerfile
    container_name: swiftlogistics-wms-service
    restart: unless-stopped
    ports:
      - "4000:4000"
      - "4001:4001"
    environment:
      NODE_ENV: production
      PORT: 4001
      TCP_PORT: 4000
      MONGODB_URI: mongodb://admin:swiftlogistics123@mongodb:27017/swiftlogistics?authSource=admin
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://admin:swiftlogistics123@rabbitmq:5672
      JWT_SECRET: swiftlogistics-super-secret-jwt-key-2025
      CLIENT_URL: http://localhost:8081
      SERVICE_REGISTRY_URL: http://service-registry:3009
      REGISTRY_URL: http://service-registry:3009
      SERVICE_HOST: wms-service
    depends_on:
      - mongodb
      - redis
      - rabbitmq
      - service-registry
    networks:
      - swiftlogistics-network

  # Client Portal (React App)
  client-portal:
    build:
      context: ./client-portal
      dockerfile: Dockerfile
    container_name: swiftlogistics-client-portal
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      REACT_APP_API_URL: http://localhost:3000
    depends_on:
      - api-gateway
    networks:
      - swiftlogistics-network

volumes:
  mongodb_data:
  redis_data:
  rabbitmq_data:

networks:
  swiftlogistics-network:
    driver: bridge
